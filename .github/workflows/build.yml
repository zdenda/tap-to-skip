name: Build Tap to skip (Windows exe)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          python tapicon.py icon.ico
          pyinstaller --onefile --noconsole --icon icon.ico --hidden-import pystray._win32 --name tap_to_skip tap_to_skip.py

      - uses: actions/upload-artifact@v4
        with:
          name: tap_to_skip-windows
          path: dist/tap_to_skip.exe
